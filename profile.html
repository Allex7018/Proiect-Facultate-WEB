<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymTips - Profil</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="profile.css">

</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header" onclick="toggleSidebar()">
    <img src="poze/logo.png" alt="GymTips" class="sidebar-logo">
    <span class="sidebar-title">GymTips</span>
  </div>
  <nav class="sidebar-nav">
    <a href="dashboard.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Pagina principală</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Profile</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">📋</span>
      <span class="nav-label">Workout Log</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">🥗</span>
      <span class="nav-label">Ghid de nutriție</span>
    </a>
    <a href="saincepem.html" class="nav-item">
      <span class="nav-icon">⭐</span>
      <span class="nav-label">Recomandări personalizate</span>
    </a>
  </nav>
  <div class="sidebar-resize" id="resizeHandle"></div>
</aside>

<main class="main-content" id="mainContent">
  <div class="profile-bg"></div>
  <div class="profile-wrapper">
    <div class="profile-card">

      <div class="profile-top-bar">
        <span class="profile-page-title">Profilul meu</span>
      </div>

      <div class="avatar-section">
        <div class="avatar-ring">
          <img src="" alt="Avatar" class="avatar-img" id="avatarImg">
          <div class="avatar-placeholder" id="avatarPlaceholder">
            <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
              <circle cx="40" cy="28" r="16" fill="#bbb"/>
              <ellipse cx="40" cy="68" rx="26" ry="16" fill="#bbb"/>
            </svg>
          </div>
        </div>
        <label class="change-pfp-btn" for="pfpInput">✎ Schimbă poza</label>
        <input type="file" id="pfpInput" accept="image/*" style="display:none" onchange="changePfp(event)">
      </div>

      <div class="profile-info">
        <div class="info-row">
          <span class="info-icon">👤</span>
          <div class="info-text">
            <span class="info-label">Username</span>
            <span class="info-value" id="displayUsername">—</span>
          </div>
        </div>
        <div class="info-divider"></div>
        <div class="info-row">
          <span class="info-icon">✉</span>
          <div class="info-text">
            <span class="info-label">Email</span>
            <span class="info-value" id="displayEmail">—</span>
          </div>
        </div>
      </div>

      <button class="logout-btn" onclick="handleLogout()">
        ⏻ &nbsp;Log out
      </button>

    </div>
  </div>
</main>

<script>
  let collapsed = false;
  const MIN_W = 52;
  const DEFAULT_W = 260;

  function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    const main = document.getElementById("mainContent");
    collapsed = !collapsed;
    if (collapsed) {
      sidebar.style.width = MIN_W + "px";
      sidebar.classList.add("collapsed");
      main.style.marginLeft = MIN_W + "px";
    } else {
      sidebar.style.width = DEFAULT_W + "px";
      sidebar.classList.remove("collapsed");
      main.style.marginLeft = DEFAULT_W + "px";
    }
  }

  const handle = document.getElementById("resizeHandle");
  let isResizing = false;

  handle.addEventListener("mousedown", (e) => {
    isResizing = true;
    handle.classList.add("dragging");
    document.body.style.cursor = "ew-resize";
    document.body.style.userSelect = "none";
  });

  document.addEventListener("mousemove", (e) => {
    if (!isResizing) return;
    const sidebar = document.getElementById("sidebar");
    const main = document.getElementById("mainContent");
    let newW = e.clientX;
    if (newW < MIN_W) newW = MIN_W;
    if (newW > 480) newW = 480;
    sidebar.style.width = newW + "px";
    main.style.marginLeft = newW + "px";
    if (newW <= MIN_W + 20) {
      sidebar.classList.add("collapsed");
      collapsed = true;
    } else {
      sidebar.classList.remove("collapsed");
      collapsed = false;
    }
  });

  document.addEventListener("mouseup", () => {
    if (isResizing) {
      isResizing = false;
      handle.classList.remove("dragging");
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
    }
  });

  const username = localStorage.getItem('gymtips_username') || 'Utilizator';
  const email = localStorage.getItem('gymtips_email') || 'email@gmail.com';
  document.getElementById('displayUsername').textContent = username;
  document.getElementById('displayEmail').textContent = email;

  const savedPfp = localStorage.getItem('gymtips_pfp');
  if (savedPfp) {
    document.getElementById('avatarImg').src = savedPfp;
    document.getElementById('avatarImg').style.display = 'block';
    document.getElementById('avatarPlaceholder').style.display = 'none';
  }

  function changePfp(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const src = e.target.result;
      document.getElementById('avatarImg').src = src;
      document.getElementById('avatarImg').style.display = 'block';
      document.getElementById('avatarPlaceholder').style.display = 'none';
      localStorage.setItem('gymtips_pfp', src);
    };
    reader.readAsDataURL(file);
  }

  function handleLogout() {
    localStorage.removeItem('gymtips_username');
    localStorage.removeItem('gymtips_email');
    localStorage.removeItem('gymtips_pfp');
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
