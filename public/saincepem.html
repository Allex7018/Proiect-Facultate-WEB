<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymTips - Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="saincepem.css">
</head>
<body>

<div class="page-bg"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="poze/logo.png" alt="GymTips" class="sidebar-logo">
    <span class="sidebar-title">GymTips</span>
    <button class="hamburger-btn" onclick="toggleSidebar()" title="Deschide/Închide meniu" aria-label="Toggle meniu">
      <span></span><span></span><span></span>
    </button>
  </div>
  <nav class="sidebar-nav">
    <a href="profile.html" class="nav-item"><span class="nav-label">Profil</span></a>
    <a href="Workoutlog.html" class="nav-item"><span class="nav-label">Workout Log</span></a>
    <a href="nutritie.html" class="nav-item"><span class="nav-label">Ghid de nutriție</span></a>
    <a href="saincepem.html" class="nav-item active"><span class="nav-label">Recomandări personalizate</span></a>
  </nav>
  <div class="sidebar-resize" id="resizeHandle"></div>
</aside>

<main class="main-content" id="mainContent">
<div class="quiz-wrapper">

  <!-- STEP 1 -->
  <div class="step active" id="step1">
    <div class="step-card">
      <div class="step-num">01</div>
      <h2>Introdu-ți datele și scopul tău</h2>
      <div class="row-inputs">
        <div class="field">
          <label>Vârstă (ani)</label>
          <input type="number" id="input-varsta" placeholder="ex: 22" min="10" max="100">
        </div>
        <div class="field">
          <label>Înălțime (cm)</label>
          <input type="number" id="input-inaltime" placeholder="ex: 175" min="140" max="220">
        </div>
      </div>
      <div class="field">
        <label>Greutate (kg)</label>
        <input type="number" id="input-greutate" placeholder="ex: 75" min="30" max="250">
      </div>
      <div class="field">
        <label>Scop</label>
        <select id="input-scop">
          <option>Masă musculară</option>
          <option>Slăbit</option>
          <option>Recompoziție</option>
          <option>Forță</option>
        </select>
      </div>
      <button class="btn" onclick="nextStep1()">Next →</button>
    </div>
  </div>

  <!-- STEP 2 -->
  <div class="step" id="step2">
    <div class="step-card">
      <div class="step-num">02</div>
      <h2>Câte zile pe săptămână ești dispus să mergi la sală?</h2>
      <div class="field">
        <label>Zile pe săptămână</label>
        <select id="zile">
          <option value="2">2 zile</option>
          <option value="3">3 zile</option>
          <option value="4">4 zile</option>
          <option value="5">5 zile</option>
          <option value="6">6 zile</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn btn-back" onclick="goTo('step1')">← Înapoi</button>
        <button class="btn" onclick="calculeazaSiMerge()">Next →</button>
      </div>
    </div>
  </div>

  <!-- STEP 3 -->
  <div class="step" id="step3">
    <div class="step-card step-card--wide">
      <div class="step-num">03</div>
      <h2>Recomandările tale personalizate:</h2>

      <!-- Info BMI + nivel -->
      <div id="info-banner" style="
        background: rgba(0,0,0,0.25);
        border-left: 3px solid var(--cream);
        padding: 12px 16px;
        margin-bottom: 20px;
        font-family: 'Lora', serif;
        font-size: 0.9rem;
        color: rgba(255,255,255,0.85);
        font-style: italic;
      "></div>

      <!-- Banner scop -->
      <div id="scop-banner" style="
        background: rgba(0,0,0,0.3);
        border-left: 3px solid #fff;
        padding: 12px 16px;
        margin-bottom: 24px;
        font-family: 'Oswald', sans-serif;
        font-size: 0.82rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--cream);
      "></div>

      <div class="cards" id="cards-container"></div>
      <button class="btn btn-back" style="margin-top:32px" onclick="goTo('step2')">← Înapoi</button>
    </div>
  </div>

</div>
</main>

<script>
  /* ── SIDEBAR ── */
  let collapsed = false;
  const MIN_W = 52, DEFAULT_W = 260;
  function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    const main    = document.getElementById("mainContent");
    collapsed = !collapsed;
    sidebar.style.width   = (collapsed ? MIN_W : DEFAULT_W) + "px";
    main.style.marginLeft = (collapsed ? MIN_W : DEFAULT_W) + "px";
    sidebar.classList.toggle("collapsed", collapsed);
  }
  const handle = document.getElementById("resizeHandle");
  let isResizing = false;
  handle.addEventListener("mousedown", () => { isResizing = true; handle.classList.add("dragging"); document.body.style.cursor = "ew-resize"; document.body.style.userSelect = "none"; });
  document.addEventListener("mousemove", (e) => {
    if (!isResizing) return;
    const sidebar = document.getElementById("sidebar"); const main = document.getElementById("mainContent");
    let w = Math.min(Math.max(e.clientX, MIN_W), 480);
    sidebar.style.width = w + "px"; main.style.marginLeft = w + "px";
    const col = w <= MIN_W + 20; sidebar.classList.toggle("collapsed", col); collapsed = col;
  });
  document.addEventListener("mouseup", () => { if (!isResizing) return; isResizing = false; handle.classList.remove("dragging"); document.body.style.cursor = ""; document.body.style.userSelect = ""; });

  const gymuser = JSON.parse(sessionStorage.getItem('gymuser') || 'null');

  /* ── VALIDARE STEP 1 ── */
  function nextStep1() {
    const varstaEl   = document.getElementById('input-varsta');
    const inaltimeEl = document.getElementById('input-inaltime');
    const greutateEl = document.getElementById('input-greutate');
    const varsta   = parseInt(varstaEl.value);
    const inaltime = parseInt(inaltimeEl.value);
    const greutate = parseInt(greutateEl.value);

    const errors = [];
    if (!varstaEl.value || varsta < 10 || varsta > 100)  { errors.push('Vârsta trebuie să fie între 10 și 100 de ani.'); varstaEl.style.outline = '2px solid #fff'; setTimeout(() => varstaEl.style.outline = '', 1800); }
    if (!inaltimeEl.value || inaltime < 140 || inaltime > 220) { errors.push('Înălțimea trebuie să fie între 140 și 220 cm.'); inaltimeEl.style.outline = '2px solid #fff'; setTimeout(() => inaltimeEl.style.outline = '', 1800); }
    if (!greutateEl.value || greutate < 30 || greutate > 250)  { errors.push('Greutatea trebuie să fie între 30 și 250 kg.'); greutateEl.style.outline = '2px solid #fff'; setTimeout(() => greutateEl.style.outline = '', 1800); }

    if (errors.length > 0) {
      let msgEl = document.getElementById('step1-error');
      if (!msgEl) { msgEl = document.createElement('div'); msgEl.id = 'step1-error'; msgEl.style.cssText = 'background:rgba(0,0,0,0.35);color:#fff;font-family:Lora,serif;font-size:0.88rem;font-style:italic;padding:12px 16px;margin-bottom:12px;border-left:3px solid #fff;'; varstaEl.closest('.step-card').insertBefore(msgEl, varstaEl.closest('.row-inputs')); }
      msgEl.innerHTML = errors.join('<br>');
      return;
    }
    const msgEl = document.getElementById('step1-error');
    if (msgEl) msgEl.remove();
    goTo('step2');
  }

  /* ── CALCULEAZĂ SPLIT VIA API ── */
  async function calculeazaSiMerge() {
    const varsta   = parseInt(document.getElementById('input-varsta').value);
    const inaltime = parseInt(document.getElementById('input-inaltime').value);
    const greutate = parseInt(document.getElementById('input-greutate').value);
    const scop     = document.getElementById('input-scop').value;
    const zile     = parseInt(document.getElementById('zile').value);

    try {
      const res  = await fetch('/api/split', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ varsta, inaltime, greutate, scop, zile })
      });
      const data = await res.json();

      // Salvează profilul dacă e logat
      if (gymuser) {
        await fetch('/api/profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: gymuser.id, varsta, inaltime, greutate, scop, zile })
        });
      }

      afiseazaStep3(data, scop);
    } catch (err) {
      console.error(err);
      goTo('step3');
    }
  }

  function afiseazaStep3(data, scop) {
    // Banner BMI
    const nivel = data.esteIncepator ? 'Nivel estimat: Începător' : 'Nivel estimat: Intermediar / Avansat';
    document.getElementById('info-banner').innerHTML =
      `BMI: <strong>${data.bmi}</strong> &nbsp;·&nbsp; ${nivel}`;

    // Banner scop
    const p = data.params;
    document.getElementById('scop-banner').innerHTML =
      `🎯 ${scop}: ${p.serii} serii × ${p.rep} rep &nbsp;—&nbsp; <span style="color:#fff;text-transform:none;font-family:Lora,serif;font-style:italic;letter-spacing:0;">${p.nota}</span>`;

    // Carduri splituri
    const container = document.getElementById('cards-container');
    container.innerHTML = data.splits.map(s => `
      <div class="card">
        <div class="tag">Split</div>
        <div class="name">${s.name}</div>
        <p style="font-family:'Lora',serif;font-size:0.78rem;color:#666;margin:0 0 14px;font-style:italic;">${s.descriere}</p>
        <a class="see" href="split.html?split=${encodeURIComponent(s.name)}">Vezi mai mult</a>
      </div>
    `).join('');

    goTo('step3');
  }

  function goTo(stepId) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(stepId).classList.add('active');
  }

  /* ── Blocare litere în câmpuri numerice ── */
  document.querySelectorAll('#input-varsta, #input-inaltime, #input-greutate').forEach(input => {
    input.addEventListener('keydown', e => { if (['e','E','+','-','.'].includes(e.key)) e.preventDefault(); });
  });

  /* ── Dacă are profil salvat, sări direct la step 3 ── */
  window.addEventListener('DOMContentLoaded', async () => {
    if (!gymuser) return;
    try {
      const res  = await fetch(`/api/profile?user_id=${gymuser.id}`);
      const data = await res.json();
      if (!data.profile) return;
      const p = data.profile;
      document.getElementById('input-varsta').value   = p.varsta;
      document.getElementById('input-inaltime').value = p.inaltime;
      document.getElementById('input-greutate').value = p.greutate;
      document.getElementById('input-scop').value     = p.scop;
      document.getElementById('zile').value           = String(p.zile);

      const res2 = await fetch('/api/split', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ varsta: p.varsta, inaltime: p.inaltime, greutate: p.greutate, scop: p.scop, zile: p.zile })
      });
      const splitData = await res2.json();
      afiseazaStep3(splitData, p.scop);
    } catch (e) {}
  });
</script>

</body>
</html>
