<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymTips - Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="saincepem.css">
</head>
<body>

<div class="page-bg"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="poze/logo.png" alt="GymTips" class="sidebar-logo">
    <span class="sidebar-title">GymTips</span>
    <button class="hamburger-btn" onclick="toggleSidebar()" title="Deschide/Închide meniu" aria-label="Toggle meniu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
  <nav class="sidebar-nav">
    <a href="profile.html" class="nav-item">
      <span class="nav-label">Profil</span>
    </a>
    <a href="Workoutlog.html" class="nav-item">
      <span class="nav-label">Workout Log</span>
    </a>
    <a href="nutritie.html" class="nav-item">
      <span class="nav-label">Ghid de nutriție</span>
    </a>
    <a href="saincepem.html" class="nav-item active">
      <span class="nav-label">Recomandări personalizate</span>
    </a>
  </nav>
  <div class="sidebar-resize" id="resizeHandle"></div>
</aside>

<main class="main-content" id="mainContent">

<div class="quiz-wrapper">

  <!-- STEP 1 -->
  <div class="step active" id="step1">
    <div class="step-card">
      <div class="step-num">01</div>
      <h2>Introdu-ți datele și scopul tău</h2>

      <div class="row-inputs">
        <div class="field">
          <label>Vârstă (ani)</label>
          <input type="number" id="input-varsta" placeholder="ex: 22" min="10" max="100">
        </div>
        <div class="field">
          <label>Înălțime (cm)</label>
          <input type="number" id="input-inaltime" placeholder="ex: 175" min="140" max="220">
        </div>
      </div>

      <div class="field">
        <label>Greutate (kg)</label>
        <input type="number" id="input-greutate" placeholder="ex: 75" min="30" max="250">
      </div>

      <div class="field">
        <label>Scop</label>
        <select id="input-scop">
          <option>Masă musculară</option>
          <option>Slăbit</option>
          <option>Recompoziție</option>
          <option>Forță</option>
        </select>
      </div>

      <button class="btn" onclick="nextStep1()">Next →</button>
    </div>
  </div>

  <!-- STEP 2 -->
  <div class="step" id="step2">
    <div class="step-card">
      <div class="step-num">02</div>
      <h2>Câte zile pe săptămână ești dispus să mergi la sală?</h2>

      <div class="field">
        <label>Zile pe săptămână</label>
        <select id="zile">
          <option value="2">2 zile</option>
          <option value="3">3 zile</option>
          <option value="4">4 zile</option>
          <option value="5">5 zile</option>
          <option value="6">6 zile</option>
        </select>
      </div>

      <div class="btn-row">
        <button class="btn btn-back" onclick="goTo('step1')">← Înapoi</button>
        <button class="btn" onclick="goTo('step3')">Next →</button>
      </div>
    </div>
  </div>

  <!-- STEP 3 -->
  <div class="step" id="step3">
    <div class="step-card step-card--wide">
      <div class="step-num">03</div>
      <h2>Perfect! Recomandările noastre sunt:</h2>
      <div class="cards" id="cards-container"></div>
      <button class="btn btn-back" style="margin-top:32px" onclick="goTo('step2')">← Înapoi</button>
    </div>
  </div>

</div><!-- /quiz-wrapper -->
</main>

<script>
  /* ── SIDEBAR ── */
  let collapsed = false;
  const MIN_W = 52, DEFAULT_W = 260;
  function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    const main = document.getElementById("mainContent");
    collapsed = !collapsed;
    sidebar.style.width = (collapsed ? MIN_W : DEFAULT_W) + "px";
    main.style.marginLeft = (collapsed ? MIN_W : DEFAULT_W) + "px";
    sidebar.classList.toggle("collapsed", collapsed);
  }
  const handle = document.getElementById("resizeHandle");
  let isResizing = false;
  handle.addEventListener("mousedown", () => { isResizing = true; handle.classList.add("dragging"); document.body.style.cursor = "ew-resize"; document.body.style.userSelect = "none"; });
  document.addEventListener("mousemove", (e) => {
    if (!isResizing) return;
    const sidebar = document.getElementById("sidebar"); const main = document.getElementById("mainContent");
    let w = Math.min(Math.max(e.clientX, MIN_W), 480);
    sidebar.style.width = w + "px"; main.style.marginLeft = w + "px";
    const col = w <= MIN_W + 20; sidebar.classList.toggle("collapsed", col); collapsed = col;
  });
  document.addEventListener("mouseup", () => { if (!isResizing) return; isResizing = false; handle.classList.remove("dragging"); document.body.style.cursor = ""; document.body.style.userSelect = ""; });

  /* ── QUIZ ── */
  const recomandari = {
    2: [{ tag: 'Split', name: 'Full Body x2' }],
    3: [{ tag: 'Split', name: 'Upper/Lower + Full Body' }, { tag: 'Split', name: 'Full Body x3' }],
    4: [{ tag: 'Split', name: 'Upper/Lower x2' }, { tag: 'Split', name: 'PPL + Full Body' }, { tag: 'Split', name: 'Arnold Split + Legs' }],
    5: [{ tag: 'Split', name: 'PPL' }, { tag: 'Split', name: 'PPL + Push/Pull' }, { tag: 'Split', name: 'Arnold Split + Legs' }],
    6: [{ tag: 'Split', name: 'PPL x2' }, { tag: 'Split', name: 'PPL + Arm Day + Upper/Lower' }, { tag: 'Split', name: 'Arnold Split + Legs' }],
  };

  function getSplitLink(r) {
    return `split.html?split=${encodeURIComponent(r.name)}`;
  }

  function nextStep1() {
    const varstaEl   = document.getElementById('input-varsta');
    const inaltimeEl = document.getElementById('input-inaltime');
    const greutateEl = document.getElementById('input-greutate');
    const varsta   = parseInt(varstaEl.value);
    const inaltime = parseInt(inaltimeEl.value);
    const greutate = parseInt(greutateEl.value);

    const errors = [];
    if (!varstaEl.value || varsta < 10 || varsta > 100) {
      errors.push('Vârsta trebuie să fie între 10 și 100 de ani.');
      varstaEl.style.outline = '2px solid #fff';
      setTimeout(() => varstaEl.style.outline = '', 1800);
    }
    if (!greutateEl.value || greutate < 30 || greutate > 250) {
      errors.push('Greutatea trebuie să fie între 30 și 250 kg.');
      greutateEl.style.outline = '2px solid #fff';
      setTimeout(() => greutateEl.style.outline = '', 1800);
    }
    if (!inaltimeEl.value || inaltime < 140 || inaltime > 220) {
      errors.push('Înălțimea trebuie să fie între 140 și 220 cm.');
      inaltimeEl.style.outline = '2px solid #fff';
      setTimeout(() => inaltimeEl.style.outline = '', 1800);
    }

    if (errors.length > 0) {
      let msgEl = document.getElementById('step1-error');
      if (!msgEl) {
        msgEl = document.createElement('div');
        msgEl.id = 'step1-error';
        msgEl.style.cssText = 'background:rgba(0,0,0,0.35);color:#fff;font-family:Lora,serif;font-size:0.88rem;font-style:italic;padding:12px 16px;margin-bottom:12px;border-left:3px solid #fff;';
        varstaEl.closest('.step-card').insertBefore(msgEl, varstaEl.closest('.row-inputs'));
      }
      msgEl.innerHTML = errors.join('<br>');
      return;
    }

    const msgEl = document.getElementById('step1-error');
    if (msgEl) msgEl.remove();
    goTo('step2');
  }

  function goTo(stepId) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(stepId).classList.add('active');
    if (stepId === 'step3') {
      const zile = parseInt(document.getElementById('zile').value);
      const rec = (recomandari[zile] || []);
      const container = document.getElementById('cards-container');
      container.innerHTML = rec.map(r => `
        <div class="card" data-split-card>
          <div class="tag">${r.tag}</div>
          <div class="name">${r.name}</div>
          <a class="see" href="${getSplitLink(r)}">Vezi mai mult</a>
        </div>
      `).join('');
    }
  }
  /* ── BLOCARE LITERE ȘI CARACTERE SPECIALE ── */
  document.querySelectorAll('#input-varsta, #input-inaltime, #input-greutate').forEach(input => {
    input.addEventListener('keydown', function(e) {
      // Blocăm 'e', 'E', '+', '-' și '.' (punctul zecimal, deoarece vrem doar numere întregi aici)
      if (['e', 'E', '+', '-', '.'].includes(e.key)) {
        e.preventDefault();
      }
    });
  });
</script>

</body>
</html>
