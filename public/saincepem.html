<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymTips - Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="saincepem.css">
</head>
<body>

<div class="page-bg"></div>

<header>
  <a href="home.html"><img src="poze/logo.png" alt="GymTips" class="logo"></a>
</header>

<div class="quiz-wrapper">

  <!-- STEP 1 -->
  <div class="step" id="step1">
    <div class="step-card">
      <div class="step-num">01</div>
      <h2>Introdu-ți datele și scopul tău</h2>

      <div class="row-inputs">
        <div class="field">
          <label>Vârstă</label>
          <select id="varsta">
            <option>18-25</option>
            <option>26-35</option>
            <option>36-45</option>
            <option>45+</option>
          </select>
        </div>
        <div class="field">
          <label>Înălțime</label>
          <select id="inaltime">
            <option>160cm</option>
            <option>165cm</option>
            <option>170cm</option>
            <option>175cm</option>
            <option>180cm</option>
            <option>185cm</option>
            <option>190cm+</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Greutate</label>
        <select id="greutate">
          <option>50-60kg</option>
          <option>60-70kg</option>
          <option>70-80kg</option>
          <option>80-90kg</option>
          <option>90-100kg</option>
          <option>100kg+</option>
        </select>
      </div>

      <div class="field">
        <label>Scop</label>
        <select id="scop">
          <option>Masă musculară</option>
          <option>Slăbit</option>
          <option>Recompoziție</option>
          <option>Forță</option>
        </select>
      </div>

      <button class="btn" onclick="goTo('step2')">Next →</button>
    </div>
  </div>

  <!-- STEP 2 -->
  <div class="step" id="step2">
    <div class="step-card">
      <div class="step-num">02</div>
      <h2>Câte zile pe săptămână ești dispus să mergi la sală?</h2>

      <div class="field">
        <label>Zile pe săptămână</label>
        <select id="zile">
          <option value="2">2 zile</option>
          <option value="3">3 zile</option>
          <option value="4">4 zile</option>
          <option value="5">5 zile</option>
          <option value="6">6 zile</option>
        </select>
      </div>

      <div class="btn-row">
        <button class="btn btn-back" onclick="goTo('step1')">← Înapoi</button>
        <button class="btn" onclick="saveAndContinue()">Next →</button>
      </div>
    </div>
  </div>

  <!-- STEP 3 -->
  <div class="step" id="step3">
    <div class="step-card step-card--wide">
      <div class="step-num">03</div>
      <h2>Perfect! Recomandările noastre sunt:</h2>
      <div class="cards" id="cards-container"></div>
      <button class="btn btn-back" style="margin-top:32px" onclick="goTo('step2')">← Înapoi</button>
    </div>
  </div>

</div>

<script>
  const recomandari = {
    2: [{ tag: 'Split', name: 'Full Body' }],
    3: [{ tag: 'Split', name: 'PPL/UL' }, { tag: 'Split', name: 'Full Body 3x' }],
    4: [{ tag: 'Split', name: 'Upper/Lower' }, { tag: 'Split', name: 'PPL+Full' }],
    5: [{ tag: 'Split', name: 'PPL' }, { tag: 'Split', name: 'Bro Split' }],
    6: [{ tag: 'Split', name: 'PPL x2' }, { tag: 'Split', name: 'Arnold Split' }],
  };

  const gymuser = JSON.parse(sessionStorage.getItem('gymuser') || 'null');

  /* ── La încărcare: verifică dacă există profil salvat ── */
  window.addEventListener('DOMContentLoaded', async () => {
    if (!gymuser) {
      // Nelogat — arată step 1 normal
      goTo('step1');
      return;
    }

    try {
      const res  = await fetch(`/api/profile?user_id=${gymuser.id}`);
      const data = await res.json();

      if (data.profile) {
        // Profil există — setează valorile în selects și sari la step 3
        setSelectValue('varsta',   data.profile.varsta);
        setSelectValue('inaltime', data.profile.inaltime);
        setSelectValue('greutate', data.profile.greutate);
        setSelectValue('scop',     data.profile.scop);
        setSelectValue('zile',     String(data.profile.zile));
        showRecomandari(data.profile.zile);
        goTo('step3');
      } else {
        goTo('step1');
      }
    } catch (err) {
      goTo('step1');
    }
  });

  function setSelectValue(id, value) {
    const sel = document.getElementById(id);
    if (!sel) return;
    for (let opt of sel.options) {
      if (opt.value === value || opt.text === value) {
        opt.selected = true;
        break;
      }
    }
  }

  function goTo(stepId) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(stepId).classList.add('active');
    if (stepId === 'step3') {
      const zile = parseInt(document.getElementById('zile').value);
      showRecomandari(zile);
    }
  }

  function showRecomandari(zile) {
    const rec       = recomandari[zile] || [];
    const container = document.getElementById('cards-container');
    container.innerHTML = rec.map(r => `
      <div class="card">
        <div class="tag">${r.tag}</div>
        <div class="name">${r.name}</div>
        <a class="see" href="split.html?split=${encodeURIComponent(r.name)}">Vezi mai mult</a>
      </div>
    `).join('');
  }

  /* ── Salvează profilul și mergi la step 3 ── */
  async function saveAndContinue() {
    if (gymuser) {
      try {
        await fetch('/api/profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id:  gymuser.id,
            varsta:   document.getElementById('varsta').value,
            inaltime: document.getElementById('inaltime').value,
            greutate: document.getElementById('greutate').value,
            scop:     document.getElementById('scop').value,
            zile:     parseInt(document.getElementById('zile').value)
          })
        });
      } catch (err) {
        console.error('Eroare la salvarea profilului:', err);
      }
    }
    goTo('step3');
  }
</script>

</body>
</html>
