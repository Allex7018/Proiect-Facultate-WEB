<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymTips - Profil</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="profile.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="poze/logo.png" alt="GymTips" class="sidebar-logo">
    <span class="sidebar-title">GymTips</span>
    <button class="hamburger-btn" onclick="toggleSidebar()" title="Deschide/Închide meniu" aria-label="Toggle meniu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
  <nav class="sidebar-nav">
    <a href="profile.html" class="nav-item active">
      <span class="nav-label">Profil</span>
    </a>
    <a href="Workoutlog.html" class="nav-item">
      <span class="nav-label">Workout Log</span>
    </a>
    <a href="nutritie.html" class="nav-item">
      <span class="nav-label">Ghid de nutriție</span>
    </a>
    <a href="saincepem.html" class="nav-item">
      <span class="nav-label">Recomandări personalizate</span>
    </a>
  </nav>
  <div class="sidebar-resize" id="resizeHandle"></div>
</aside>

<main class="main-content" id="mainContent">
  <div class="profile-bg"></div>
  <div class="profile-welcome-banner" id="profileWelcome"></div>
  <div class="profile-wrapper">
    <div class="profile-card">

      <div class="profile-top-bar">
        <span class="profile-page-title">Profilul meu</span>
      </div>

      <div class="avatar-section">
        <div class="avatar-ring">
          <img src="" alt="Avatar" class="avatar-img" id="avatarImg">
          <div class="avatar-placeholder" id="avatarPlaceholder">
            <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
              <circle cx="40" cy="28" r="16" fill="#bbb"/>
              <ellipse cx="40" cy="68" rx="26" ry="16" fill="#bbb"/>
            </svg>
          </div>
        </div>
        <label class="change-pfp-btn" for="pfpInput">✎ Schimbă poza</label>
        <input type="file" id="pfpInput" accept="image/*" style="display:none" onchange="changePfp(event)">
      </div>

      <div class="profile-info">
        <div class="info-row">
          <span class="info-icon">👤</span>
          <div class="info-text">
            <span class="info-label" style="color: #000000 !important; font-weight: bold; font-size: 0.75rem; letter-spacing: 2px;">Username</span>
            <span class="info-value" id="displayUsername" style="color: #000000 !important; font-weight: bold;">—</span>
          </div>
        </div>
        <div class="info-divider"></div>
        <div class="info-row">
          <span class="info-icon">✉</span>
          <div class="info-text">
            <span class="nav-label" style="color: #000000 !important; font-weight: bold; font-size: 0.75rem; letter-spacing: 2px;">Email</span>
            <span class="info-value" id="displayEmail" style="color: #000000 !important; font-weight: bold;">—</span>
          </div>
        </div>
      </div>

      <div id="recommendations-box" style="display: none; margin-top: 25px; padding: 20px; background: rgba(255, 255, 255, 0.03); border-left: 4px solid #ffcc00; border-radius: 4px; text-align: left;">
        <h3 style="margin: 0 0 12px 0; font-family: 'Oswald', sans-serif; font-size: 1.1rem; color: #ffcc00; letter-spacing: 0.5px; text-transform: uppercase;">
          💡 Sugestii de Progres (Smart Coach)
        </h3>
        <ul id="recommendations-list" style="margin: 0; padding-left: 20px; font-family: 'Lora', serif; font-size: 0.95rem; line-height: 1.6; color: #e0e0e0;">
          </ul>
      </div>

      <button class="logout-btn" onclick="handleLogout()" style="margin-top: 25px;">
        ⏻ &nbsp;Log out
      </button>

    </div>
  </div>
</main>

<script>
  let collapsed = false;
  const MIN_W = 52;
  const DEFAULT_W = 260;

  function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    const main = document.getElementById("mainContent");
    const banner = document.getElementById("profileWelcome");
    collapsed = !collapsed;
    const w = collapsed ? MIN_W : DEFAULT_W;
    sidebar.style.width = w + "px";
    sidebar.classList.toggle("collapsed", collapsed);
    main.style.marginLeft = w + "px";
    if (banner) banner.style.left = w + "px";
  }

  const handle = document.getElementById("resizeHandle");
  let isResizing = false;

  handle.addEventListener("mousedown", (e) => {
    isResizing = true;
    handle.classList.add("dragging");
    document.body.style.cursor = "ew-resize";
    document.body.style.userSelect = "none";
  });

  document.addEventListener("mousemove", (e) => {
    if (!isResizing) return;
    const sidebar = document.getElementById("sidebar");
    const main = document.getElementById("mainContent");
    const banner = document.getElementById("profileWelcome");
    let newW = e.clientX;
    if (newW < MIN_W) newW = MIN_W;
    if (newW > 480) newW = 480;
    sidebar.style.width = newW + "px";
    main.style.marginLeft = newW + "px";
    if (banner) banner.style.left = newW + "px";
    if (newW <= MIN_W + 20) {
      sidebar.classList.add("collapsed");
      collapsed = true;
    } else {
      sidebar.classList.remove("collapsed");
      collapsed = false;
    }
  });

  document.addEventListener("mouseup", () => {
    if (isResizing) {
      isResizing = false;
      handle.classList.remove("dragging");
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
    }
  });

  
  const gymUserSession = sessionStorage.getItem('gymuser');
  let username = 'Utilizator';
  let email = 'exemplu@email.com';

  if (gymUserSession) {
    const userData = JSON.parse(gymUserSession);
    username = userData.name || 'Utilizator';
    email = userData.email || 'cont@gymtips.ro'; 
  } else {
    window.location.href = 'login.html';
  }

  document.getElementById('displayUsername').textContent = username;
  document.getElementById('displayEmail').textContent = email;
  document.getElementById('profileWelcome').textContent = 'Bun venit, ' + username + '!';

 
  if (gymUserSession) {
    const userData = JSON.parse(gymUserSession);
    const userId = userData.id;

    fetch(`/api/profile?user_id=${userId}`)
      .then(res => res.json())
      .then(data => {
        if (!data || !data.profile) return;
        
        const scopLower = data.profile.scop.toLowerCase();
        
        
        let repsMinime = 10;
        let repsMaxime = 12; 

        if (scopLower.includes('masă') || scopLower.includes('masa') || scopLower.includes('musculară') || scopLower.includes('musculara')) {
          repsMinime = 8;
          repsMaxime = 10;
        } else if (scopLower.includes('slăbit') || scopLower.includes('slabit') || scopLower.includes('slabire') || scopLower.includes('refacere') || scopLower.includes('recuperare')) {
          repsMinime = 10;
          repsMaxime = 12;
        } else if (scopLower.includes('forță') || scopLower.includes('forta')) {
          repsMinime = 6;
          repsMaxime = 6;
        }

        
       
        fetch(`/api/workoutlog?user_id=${userId}`)
          .then(resLog => resLog.json())
          .then(dataLog => {
            const logs = dataLog.logs || [];
            if (logs.length === 0) return;

            const ultimulAntrenamentPerExercitiu = {};
            logs.forEach(log => {
              ultimulAntrenamentPerExercitiu[log.exercise] = log;
            });

            const listaSugestii = document.getElementById('recommendations-list');
            const boxSugestii = document.getElementById('recommendations-box');
            let areSugestii = false;

            if (listaSugestii && boxSugestii) {
              listaSugestii.innerHTML = ''; 

              for (const exercitiu in ultimulAntrenamentPerExercitiu) {
                const fisierLog = ultimulAntrenamentPerExercitiu[exercitiu];
                
                
                const sets = typeof fisierLog.sets === 'string' ? JSON.parse(fisierLog.sets) : fisierLog.sets;

                if (!sets || sets.length === 0) continue;

                let sumaRepetari = 0;
                sets.forEach(set => {
                  const r = parseInt(set.reps || set.rep || set || 0);
                  sumaRepetari += r;
                });
                const mediaRepetariUltimulMeci = sumaRepetari / sets.length;

               
                if (mediaRepetariUltimulMeci > repsMaxime) {
                  areSugestii = true;
                  const li = document.createElement('li');
                  li.style.marginBottom = '10px';
                  li.style.color = '#85ff7a'; // Verde pentru progres / creștere
                  li.innerHTML = `💪 Poți să <strong>crești</strong> greutatea la exercițiul <strong>${exercitiu}</strong>! (Media recentă: ${mediaRepetariUltimulMeci.toFixed(1)} repetiții vs. maximul indicat de ${repsMaxime}).`;
                  listaSugestii.appendChild(li);
                } 
                
                else if (mediaRepetariUltimulMeci < repsMinime) {
                  areSugestii = true;
                  const li = document.createElement('li');
                  li.style.marginBottom = '10px';
                  li.style.color = '#ff7a7a'; // Roșu/Portocaliu pentru avertizare/scădere
                  li.innerHTML = `⚠️ Se recomandă să <strong>scazi</strong> greutatea la exercițiul <strong>${exercitiu}</strong>! (Media recentă: ${mediaRepetariUltimulMeci.toFixed(1)} repetiții este sub minimul necesar de ${repsMinime}).`;
                  listaSugestii.appendChild(li);
                }
              }

              if (areSugestii) {
                boxSugestii.style.display = 'block';
              }
            }
          })
          .catch(err => console.error("Eroare la citirea antrenamentelor:", err));
      })
      .catch(err => console.error("Eroare Smart Coach:", err));
  }

  const gymuserData = gymUserSession ? JSON.parse(gymUserSession) : null;
  const userIdentifier = gymuserData && gymuserData.email ? gymuserData.email : 'guest';
  const pfpKey = 'gymtips_pfp_' + userIdentifier;
  
  const savedPfp = localStorage.getItem(pfpKey);
  if (savedPfp) {
    document.getElementById('avatarImg').src = savedPfp;
    document.getElementById('avatarImg').style.display = 'block';
    document.getElementById('avatarPlaceholder').style.display = 'none';
  } else {
    document.getElementById('avatarImg').style.display = 'none';
    document.getElementById('avatarPlaceholder').style.display = 'flex';
  }

  function changePfp(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const src = e.target.result;
      document.getElementById('avatarImg').src = src;
      document.getElementById('avatarImg').style.display = 'block';
      document.getElementById('avatarPlaceholder').style.display = 'none';
      
      
      localStorage.setItem(pfpKey, src);
    };
    reader.readAsDataURL(file);
  }

  function handleLogout() {
    sessionStorage.removeItem('gymuser'); 
    localStorage.removeItem('gymtips_username');
    localStorage.removeItem('gymtips_email');
    localStorage.removeItem('gymtips_pfp');
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
