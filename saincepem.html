<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymTips - Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="saincepem.css">
</head>
<body>

<div class="page-bg"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="poze/logo.png" alt="GymTips" class="sidebar-logo">
    <span class="sidebar-title">GymTips</span>
    <button class="hamburger-btn" onclick="toggleSidebar()" title="Deschide/Închide meniu" aria-label="Toggle meniu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
  <nav class="sidebar-nav">
    <a href="profile.html" class="nav-item">
      <span class="nav-label">Profil</span>
    </a>
    <a href="Workoutlog.html" class="nav-item">
      <span class="nav-label">Workout Log</span>
    </a>
    <a href="nutritie.html" class="nav-item">
      <span class="nav-label">Ghid de nutriție</span>
    </a>
    <a href="saincepem.html" class="nav-item active">
      <span class="nav-label">Recomandări personalizate</span>
    </a>
  </nav>
  <div class="sidebar-resize" id="resizeHandle"></div>
</aside>

<main class="main-content" id="mainContent">

<div class="quiz-wrapper">

  <!-- STEP 1 -->
  <div class="step active" id="step1">
    <div class="step-card">
      <div class="step-num">01</div>
      <h2>Introdu-ți datele și scopul tău</h2>

      <div class="row-inputs">
        <div class="field">
          <label>Vârstă (ani)</label>
          <input type="number" id="input-varsta" placeholder="ex: 22" min="10" max="99">
        </div>
        <div class="field">
          <label>Înălțime (cm)</label>
          <input type="number" id="input-inaltime" placeholder="ex: 175" min="100" max="250">
        </div>
      </div>

      <div class="field">
        <label>Greutate (kg)</label>
        <input type="number" id="input-greutate" placeholder="ex: 75" min="30" max="300">
      </div>

      <div class="field">
        <label>Scop</label>
        <select id="input-scop">
          <option>Masă musculară</option>
          <option>Slăbit</option>
          <option>Recompoziție</option>
          <option>Forță</option>
        </select>
      </div>

      <button class="btn" onclick="nextStep1()">Next →</button>
    </div>
  </div>

  <!-- STEP 2 -->
  <div class="step" id="step2">
    <div class="step-card">
      <div class="step-num">02</div>
      <h2>Câte zile pe săptămână ești dispus să mergi la sală?</h2>

      <div class="field">
        <label>Zile pe săptămână</label>
        <select id="zile">
          <option value="2">2 zile</option>
          <option value="3">3 zile</option>
          <option value="4">4 zile</option>
          <option value="5">5 zile</option>
          <option value="6">6 zile</option>
        </select>
      </div>

      <div class="btn-row">
        <button class="btn btn-back" onclick="goTo('step1')">← Înapoi</button>
        <button class="btn" onclick="goTo('step3')">Next →</button>
      </div>
    </div>
  </div>

  <!-- STEP 3 -->
  <div class="step" id="step3">
    <div class="step-card step-card--wide">
      <div class="step-num">03</div>
      <h2>Perfect! Recomandările noastre sunt:</h2>
      <div class="cards" id="cards-container"></div>
      <button class="btn btn-back" style="margin-top:32px" onclick="goTo('step2')">← Înapoi</button>
    </div>
  </div>

</div><!-- /quiz-wrapper -->
</main>

<script>
  /* ── SIDEBAR ── */
  let collapsed = false;
  const MIN_W = 52, DEFAULT_W = 260;
  function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    const main = document.getElementById("mainContent");
    collapsed = !collapsed;
    sidebar.style.width = (collapsed ? MIN_W : DEFAULT_W) + "px";
    main.style.marginLeft = (collapsed ? MIN_W : DEFAULT_W) + "px";
    sidebar.classList.toggle("collapsed", collapsed);
  }
  const handle = document.getElementById("resizeHandle");
  let isResizing = false;
  handle.addEventListener("mousedown", () => { isResizing = true; handle.classList.add("dragging"); document.body.style.cursor = "ew-resize"; document.body.style.userSelect = "none"; });
  document.addEventListener("mousemove", (e) => {
    if (!isResizing) return;
    const sidebar = document.getElementById("sidebar"); const main = document.getElementById("mainContent");
    let w = Math.min(Math.max(e.clientX, MIN_W), 480);
    sidebar.style.width = w + "px"; main.style.marginLeft = w + "px";
    const col = w <= MIN_W + 20; sidebar.classList.toggle("collapsed", col); collapsed = col;
  });
  document.addEventListener("mouseup", () => { if (!isResizing) return; isResizing = false; handle.classList.remove("dragging"); document.body.style.cursor = ""; document.body.style.userSelect = ""; });

  /* ── QUIZ ── */
  const recomandari = {
    2: [{ tag: 'Split', name: 'Full Body' }],
    3: [{ tag: 'Split', name: 'PPL/UL' }, { tag: 'Split', name: 'Full Body 3x' }],
    4: [{ tag: 'Split', name: 'Upper/Lower' }, { tag: 'Split', name: 'PPL+Full' }],
    5: [{ tag: 'Split', name: 'PPL' }, { tag: 'Split', name: 'Bro Split' }],
    6: [{ tag: 'Split', name: 'PPL x2' }, { tag: 'Split', name: 'Arnold Split' }],
  };

  function nextStep1() {
    const varsta = document.getElementById('input-varsta').value;
    const inaltime = document.getElementById('input-inaltime').value;
    const greutate = document.getElementById('input-greutate').value;
    if (!varsta || !inaltime || !greutate) {
      ['input-varsta','input-inaltime','input-greutate'].forEach(id => {
        const el = document.getElementById(id);
        if (!el.value) { el.style.borderBottom = '2px solid #fff'; setTimeout(() => el.style.borderBottom = '', 1500); }
      });
      return;
    }
    goTo('step2');
  }

  function goTo(stepId) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(stepId).classList.add('active');
    if (stepId === 'step3') {
      const zile = parseInt(document.getElementById('zile').value);
      const rec = recomandari[zile] || [];
      const container = document.getElementById('cards-container');
      container.innerHTML = rec.map(r => `
        <div class="card">
          <div class="tag">${r.tag}</div>
          <div class="name">${r.name}</div>
          <a class="see" href="split.html?split=${encodeURIComponent(r.name)}">Vezi mai mult</a>
        </div>
      `).join('');
    }
  }
</script>

</body>
</html>
